name: APF3 CI

on:
  push:
    branches: [apf3-integrador-ii]
  pull_request:
    branches: [apf3-integrador-ii]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, pdo_mysql, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production PHP image
        run: docker build --file backend/Dockerfile --tag cesarcontrol-apf3:ci backend
      - name: Smoke PHP image on dynamic port
        run: |
          docker run --rm -d --name cesarcontrol-apf3-ci -p 18080:8080 \
            -e PORT=8080 \
            -e APP_KEY=base64:MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA= \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=:memory: \
            cesarcontrol-apf3:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/api/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs cesarcontrol-apf3-ci
          exit 1
      - name: Remove smoke container
        if: always()
        run: docker rm -f cesarcontrol-apf3-ci || true
